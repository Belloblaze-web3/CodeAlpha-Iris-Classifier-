name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-api.txt
      - name: Compile application files
        run: python -m py_compile src/classifier.py src/api.py streamlit_app.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
